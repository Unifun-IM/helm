apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "livekit.fullname" . }}
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ include "livekit.httpPort" . }}
    log_level: {{ .Values.livekit.logLevel }}
    key_file: {{ .Values.apiKeys.mountPath }}

    room:
      empty_timeout: {{ .Values.livekit.room.emptyTimeout }}
      departure_timeout: {{ .Values.livekit.room.departureTimeout }}

    rtc:
      tcp_port: {{ include "livekit.rtcTcpPort" . }}
      udp_port: {{ include "livekit.rtcUdpPort" . }}
      use_external_ip: {{ .Values.livekit.rtc.useExternalIP }}
{{ if .Values.livekit.rtc.nodeIP }}
      node_ip: {{ .Values.livekit.rtc.nodeIP | quote }}
{{ end }}
{{ if .Values.livekit.prometheus.enabled }}
    prometheus_port: {{ include "livekit.prometheusPort" . }}
{{ end }}
{{ if .Values.livekit.redis.enabled }}
    redis:
      address: {{ required "livekit.redis.address is required when Redis is enabled" .Values.livekit.redis.address | quote }}
      db: {{ .Values.livekit.redis.db }}
{{ if .Values.livekit.redis.username }}
      username: {{ .Values.livekit.redis.username | quote }}
{{ end }}
{{ if .Values.livekit.redis.password }}
      password: {{ .Values.livekit.redis.password | quote }}
{{ end }}
{{ if .Values.livekit.redis.tls.enabled }}
      tls:
        enabled: true
        insecure: {{ .Values.livekit.redis.tls.insecure }}
{{ end }}
{{ end }}
    turn:
      enabled: {{ .Values.livekit.turn.enabled }}
{{ if .Values.livekit.turn.enabled }}
      domain: {{ required "livekit.turn.domain is required when TURN is enabled" .Values.livekit.turn.domain | quote }}
      tls_port: {{ include "livekit.turnTlsPort" . }}
      udp_port: {{ include "livekit.turnUdpPort" . }}
{{ end }}
{{ if .Values.webhook.enabled }}
    webhook:
      # 真实值由 LIVEKIT_WEBHOOK_API_KEY 环境变量覆盖。
      api_key: ""
      urls:
{{ range required "webhook.urls must contain at least one URL when webhook is enabled" .Values.webhook.urls }}
        - {{ . | quote }}
{{ end }}
{{ end }}
