{{- if and (gt (.Values.replicaCount | int) 1) (not .Values.livekit.redis.enabled) }}
{{- fail "replicaCount 大于 1 时必须启用 livekit.redis，否则各节点房间状态不互通" }}
{{- end }}
{{- if or (gt (include "livekit.httpPort" . | int) 65535) (gt (include "livekit.rtcTcpPort" . | int) 65535) (gt (include "livekit.rtcUdpPort" . | int) 65535) }}
{{- fail "livekit.portOffset 过大，HTTP/TCP/UDP 端口超过 65535" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livekit.fullname" . }}
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "livekit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "livekit.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: livekit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --disable-strict-config
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "livekit.fullname" . }}
                  key: config.yaml
            {{- if .Values.webhook.enabled }}
            - name: LIVEKIT_WEBHOOK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeys.existingSecret }}
                  key: {{ .Values.webhook.apiKeySecretKey }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "livekit.httpPort" . }}
              hostPort: {{ include "livekit.httpPort" . }}
              protocol: TCP
            - name: rtc-tcp
              containerPort: {{ include "livekit.rtcTcpPort" . }}
              hostPort: {{ include "livekit.rtcTcpPort" . }}
              protocol: TCP
            - name: rtc-udp
              containerPort: {{ include "livekit.rtcUdpPort" . }}
              hostPort: {{ include "livekit.rtcUdpPort" . }}
              protocol: UDP
            {{- if .Values.livekit.prometheus.enabled }}
            - name: metrics
              containerPort: {{ include "livekit.prometheusPort" . }}
              hostPort: {{ include "livekit.prometheusPort" . }}
              protocol: TCP
            {{- end }}
            {{- if .Values.livekit.turn.enabled }}
            - name: turn-tls
              containerPort: {{ include "livekit.turnTlsPort" . }}
              hostPort: {{ include "livekit.turnTlsPort" . }}
              protocol: TCP
            - name: turn-udp
              containerPort: {{ include "livekit.turnUdpPort" . }}
              hostPort: {{ include "livekit.turnUdpPort" . }}
              protocol: UDP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: api-keys
              mountPath: {{ .Values.apiKeys.mountPath }}
              subPath: {{ .Values.apiKeys.secretKey }}
              readOnly: true
      volumes:
        - name: api-keys
          secret:
            secretName: {{ .Values.apiKeys.existingSecret }}
            defaultMode: 0600
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.podAntiAffinity.enabled .Values.affinity }}
      affinity:
        {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "livekit.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
        {{- end }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
