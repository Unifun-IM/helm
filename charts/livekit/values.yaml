replicaCount: 1

image:
  repository: livekit/livekit-server
  tag: v1.13.4
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "livekit"

# LiveKit 在 Kubernetes 中需要直接访问节点网络。
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# 禁止 Kubernetes 将 Service 信息注入为环境变量。
# 否则名为 livekit 的 Service 会生成：
# LIVEKIT_PORT=tcp://<cluster-ip>:7880
# 并与 LiveKit Server 的 LIVEKIT_PORT 数字参数冲突。
enableServiceLinks: false

# 单节点只能运行一个 LiveKit Pod，避免滚动更新时争抢媒体端口。
strategy:
  type: Recreate

# 官方建议为长连接预留较长的优雅退出时间。
terminationGracePeriodSeconds: 18000

livekit:
  port: 7880
  logLevel: info

  rtc:
    useExternalIP: true
    tcpPort: 7881
    # 使用 UDP mux 单端口，避免开放 50000-60000/UDP。
    udpPort: 7882

    # 当 STUN 无法识别正确公网 IP 时填写节点公网 IP，
    # 并把 useExternalIP 改为 false。
    nodeIP: ""

  prometheus:
    enabled: false
    port: 6789

  redis:
    enabled: false
    address: ""
    username: ""
    password: ""
    db: 0
    tls:
      enabled: false
      insecure: false

  turn:
    enabled: false
    domain: ""
    tlsPort: 5349
    udpPort: 3478

apiKeys:
  existingSecret: livekit-api-keys
  secretKey: keys.yaml
  mountPath: /etc/livekit/keys.yaml

# LiveKit Webhook。签名 API Key 从 apiKeys.existingSecret 读取。
webhook:
  enabled: true
  e0660049eee3c5a1dec4d2120091df43: f53fc7988c81533973b2e2961e6217cb6d782b820dd0235f90cc8cca12aa3715
  urls: 
    - https://im28-chat.im28.svc.cluster.local:8080/v1/livekit/webhook
  # 启用示例：
  # urls:
  #   - https://api.example.com/webhooks/livekit

service:
  # 避免生成 LIVEKIT_PORT、LIVEKIT_SERVICE_HOST 等同名前缀变量。
  name: livekit-http
  type: ClusterIP
  port: 7880

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  host: im-live.djftech.app
  tls:
    enabled: true
    secretName: im-live-djftech-app-tls

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 4Gi

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
